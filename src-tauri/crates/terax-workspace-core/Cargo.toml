[package]
name = "terax-workspace-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_child = "1"
tempfile = "3"

# inotify (Linux) and ReadDirectoryChangesW (Windows). macOS drives FSEvents
# from the app (src/modules/fs/watch/macos.rs), which keeps notify out of that build.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1"
