[package]
name = "terax-agent"
# The app's version (src-tauri/Cargo.toml), not the CLI's: the app compares
# it with its own to decide whether to reinstall the agent on a server.
version = "0.9.5-dy"
edition.workspace = true
license.workspace = true
publish = false
description = "Serves a Terax workspace over stdio, next to the files (on a remote server)"

[[bin]]
name = "terax-agent"
path = "src/main.rs"

[dependencies]
terax-remote-protocol = { path = "../terax-remote-protocol" }
terax-workspace-core = { path = "../terax-workspace-core" }
log = "0.4"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
