name: Release (dy)

# Builds the unsigned macOS and Linux installers of the dy build and attaches
# them to the GitHub release of the pushed tag. The Windows installers are
# built locally and uploaded when the release is created.
#
# Tags are `v<version>-dy`. release.yml excludes them: it needs the upstream
# signing secrets, which this fork does not have.
on:
  push:
    tags:
      - "v*-dy"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the installers to"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: dy-${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The agents a server's space installs: static musl binaries, built
      # with zig on every host (the zig version they are built with locally).
      # tauri.nosign.conf.json bundles them, so a build without them fails.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build the remote agents
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          pnpm build:agent

      # Ad-hoc signed ("-"): without any signature an Apple Silicon Mac
      # refuses to start the app at all. It is still not notarized.
      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}
        run: |
          pnpm tauri build \
            --target "$TERAX_CLI_TARGET" \
            --bundles dmg \
            --config src-tauri/tauri.nosign.conf.json \
            --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Build Linux packages
        if: runner.os == 'Linux'
        env:
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}
        run: |
          pnpm tauri build \
            --bundles deb,appimage \
            --config src-tauri/tauri.nosign.conf.json

      # Separate and allowed to fail: an RPM version cannot hold the "-dy"
      # suffix, and the other packages should still be published if this
      # bundler rejects it.
      - name: Build RPM package
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          pnpm tauri bundle \
            --bundles rpm \
            --config src-tauri/tauri.nosign.conf.json

      # Same fix as release.yml: the build host's libwayland is older than
      # what recent Mesa needs, and the AppImage's copy wins over the host's.
      - name: Strip bundled wayland libs from the AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/terax
          find squashfs-root \( -type f -o -type l \) \
            -name 'libwayland-*.so*' -print -delete
          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"
          popd >/dev/null
          cp "$WORK/$BASENAME" "$APPIMAGE"

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers were produced"
            exit 1
          fi
          ls -l "${files[@]}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Terax $RELEASE_TAG" --notes "See CHANGELOG.md."
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
